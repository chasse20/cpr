# Edit x-settings, then run: docker compose pull cpr-orchestrator && docker compose up -d --build
# Requires Docker Compose 2.23.1+. GPU-enabled workers also need NVIDIA Container Toolkit.
# Keep your configured copy private. Write a literal $ as $$ in values below.
name: cpr

x-settings:
  orchestrator-image: &orchestrator-image cpr:latest
  database: &database 'Host=YOUR_POSTGRES_HOST;Port=5432;Database=db;Username=cpr_app;Password=REPLACE_ME;SSL Mode=VerifyFull'
  github-token: &github-token 'REPLACE_WITH_SCOPED_GITHUB_TOKEN'
  git-name: &git-name 'Your Name'
  git-email: &git-email 'your-github-verified-email@example.com'
  desktop-public-key: &desktop-key 'ssh-ed25519 REPLACE_WITH_YOUR_DESKTOP_PUBLIC_KEY'
  # Set both to true after signing in to Codex on the workers.
  run-workers: &run-workers 'false'
  publish-approved: &publish-approved 'false'
  # Optional PR updates to a Discord channel. Keep the webhook URL in your private copy.
  discord-enabled: &discord-enabled 'false'
  discord-webhook-url: &discord-webhook-url ''

x-worker: &worker
  build: .
  image: cpr-worker:local
  depends_on:
    initialize:
      condition: service_completed_successfully
  restart: unless-stopped
  init: true
  read_only: true
  working_dir: /workspace
  stdin_open: true
  tty: true
  cap_drop: [ALL]
  # sshd must be able to record interactive logins in the Linux audit log
  cap_add: [SETUID, SETGID, CHOWN, SYS_CHROOT, DAC_OVERRIDE, AUDIT_WRITE]
  # Allow Codex to create its sandbox namespaces inside the worker
  security_opt: ['no-new-privileges:true', 'seccomp=unconfined']
  pids_limit: 2048
  shm_size: 1gb
  tmpfs:
    - /tmp:rw,exec,nosuid,size=1g,mode=1777
    - /run:rw,nosuid,mode=0755
  environment:
    NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,display
  configs:
    - source: sshd
      target: /etc/ssh/sshd_config
  entrypoint: [/bin/bash, -euc]
  command:
    - mkdir -p /run/sshd; chmod 755 /run/sshd; exec /usr/sbin/sshd -D -e

services:
  initialize:
    build: .
    image: cpr-worker:local
    restart: 'no'
    network_mode: none
    volumes:
      - ./data:/data
    environment:
      DESKTOP_PUBLIC_KEY: *desktop-key
      GIT_AUTHOR_NAME: *git-name
      GIT_AUTHOR_EMAIL: *git-email
    configs:
      - source: worker-instructions
        target: /worker-instructions
    entrypoint: [/bin/bash, -euc]
    command:
      - |
        umask 077
        printf '%s\n' "$$DESKTOP_PUBLIC_KEY" > /tmp/desktop.pub
        ssh-keygen -lf /tmp/desktop.pub >/dev/null || {
          echo 'Set desktop-public-key in compose.yaml to your desktop SSH public key.' >&2
          exit 1
        }
        mkdir -p /data/keys /data/orchestrator-ssh /data/orchestrator-data
        chmod 755 /data /data/keys
        chmod 700 /data/orchestrator-ssh /data/orchestrator-data
        # Existing private keys are reused on every start.
        make_key() {
          [[ -s "$$1" ]] || ssh-keygen -q -t ed25519 -N '' -f "$$1"
          ssh-keygen -y -f "$$1" > "$$1.pub"
          chmod 600 "$$1"
          chmod 644 "$$1.pub"
        }
        make_key /data/orchestrator-ssh/id_ed25519
        cat /tmp/desktop.pub /data/orchestrator-ssh/id_ed25519.pub > /data/keys/authorized_keys
        : > /data/orchestrator-ssh/config
        : > /data/orchestrator-ssh/known_hosts
        for id in {101..109}; do
          workspace="/data/workspaces/$$id"
          state="/data/state/$$id"
          mkdir -p "$$workspace/jobs" "$$workspace/archive" "$$state/home/coder/.codex" \
            "$$state/ssh" "$$state/cpr/jobs" "$$state/cargo"
          chown 1000:1000 "$$workspace/jobs" "$$workspace/archive"
          for directory in "$$workspace" "$$state"; do
            if [[ $$(stat -c '%u:%g' "$$directory") != 1000:1000 ]]; then
              chown -R 1000:1000 "$$directory"
            fi
          done
          chmod 700 "$$state" "$$state/home/coder" "$$state/home/coder/.codex"
          make_key "$$state/ssh/ssh_host_ed25519_key"
          chown 1000:1000 "$$state/ssh/ssh_host_ed25519_key"{,.pub}
          if [[ ! -e "$$state/home/coder/.codex/AGENTS.md" ]]; then
            install -m 600 -o 1000 -g 1000 /worker-instructions "$$state/home/coder/.codex/AGENTS.md"
          fi
          git config --file "$$state/home/coder/.gitconfig" user.name "$$GIT_AUTHOR_NAME"
          git config --file "$$state/home/coder/.gitconfig" user.email "$$GIT_AUTHOR_EMAIL"
          chown 1000:1000 "$$state/home/coder/.gitconfig"
          cat >> /data/orchestrator-ssh/config <<CONF
        Host cpr-$$id
            HostName 127.0.0.1
            Port 22$$id
            User coder
            IdentityFile /home/app/.ssh/id_ed25519
            UserKnownHostsFile /home/app/.ssh/known_hosts
            HostKeyAlias cpr-$$id
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
        CONF
          printf 'cpr-%s %s\n' "$$id" "$$(cat "$$state/ssh/ssh_host_ed25519_key.pub")" >> /data/orchestrator-ssh/known_hosts
        done
        cp /data/orchestrator-ssh/known_hosts /data/keys/cpr-worker-known_hosts
        chmod 644 /data/keys/*
        chmod 600 /data/orchestrator-ssh/config /data/orchestrator-ssh/known_hosts
        chown -R 1654:1654 /data/orchestrator-ssh
        if [[ $$(stat -c '%u:%g' /data/orchestrator-data) != 1654:1654 ]]; then
          chown -R 1654:1654 /data/orchestrator-data
        fi
        echo 'Worker SSH keys, directories, and Git identities are ready.'

  cpr-orchestrator:
    image: *orchestrator-image
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    network_mode: host
    tmpfs: [/tmp:mode=1777]
    volumes:
      - ./data/orchestrator-ssh:/home/app/.ssh:ro
      - ./data/orchestrator-data:/data
    environment:
      HOME: /home/app
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:18080
      ConnectionStrings__CPR: *database
      GH_TOKEN: *github-token
      CPR__GitAuthorName: *git-name
      CPR__GitAuthorEmail: *git-email
      CPR__IsWorkerExecutionEnabled: *run-workers
      CPR__IsPublicationEnabled: *publish-approved
      CPR__Discord__IsEnabled: *discord-enabled
      CPR__Discord__WebhookUrl: *discord-webhook-url

  # Set device_ids per worker. Remove a worker's deploy block for CPU-only use.
  w101:
    <<: *worker
    volumes:
      - ./data/workspaces/101:/workspace
      - ./data/state/101:/state
      - ./data/keys:/etc/cpr/keys:ro
    ports: ['127.0.0.1:22101:22']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  w102:
    <<: *worker
    volumes:
      - ./data/workspaces/102:/workspace
      - ./data/state/102:/state
      - ./data/keys:/etc/cpr/keys:ro
    ports: ['127.0.0.1:22102:22']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  w103:
    <<: *worker
    volumes:
      - ./data/workspaces/103:/workspace
      - ./data/state/103:/state
      - ./data/keys:/etc/cpr/keys:ro
    ports: ['127.0.0.1:22103:22']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  w104:
    <<: *worker
    volumes:
      - ./data/workspaces/104:/workspace
      - ./data/state/104:/state
      - ./data/keys:/etc/cpr/keys:ro
    ports: ['127.0.0.1:22104:22']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  w105:
    <<: *worker
    volumes:
      - ./data/workspaces/105:/workspace
      - ./data/state/105:/state
      - ./data/keys:/etc/cpr/keys:ro
    ports: ['127.0.0.1:22105:22']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  w106:
    <<: *worker
    volumes:
      - ./data/workspaces/106:/workspace
      - ./data/state/106:/state
      - ./data/keys:/etc/cpr/keys:ro
    ports: ['127.0.0.1:22106:22']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  w107:
    <<: *worker
    volumes:
      - ./data/workspaces/107:/workspace
      - ./data/state/107:/state
      - ./data/keys:/etc/cpr/keys:ro
    ports: ['127.0.0.1:22107:22']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]

  w108:
    <<: *worker
    volumes:
      - ./data/workspaces/108:/workspace
      - ./data/state/108:/state
      - ./data/keys:/etc/cpr/keys:ro
    ports: ['127.0.0.1:22108:22']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]

  w109:
    <<: *worker
    volumes:
      - ./data/workspaces/109:/workspace
      - ./data/state/109:/state
      - ./data/keys:/etc/cpr/keys:ro
    ports: ['127.0.0.1:22109:22']
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]

configs:
  sshd:
    file: ./sshd_config
  worker-instructions:
    file: ./worker-instructions.md
